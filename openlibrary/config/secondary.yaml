  fiction_codes:
    F: FICTION
    N: NONFICTION
    O: OTHER_LITERARY
    U: UNCLEAR
  relevance_codes:
    '0': NONE
    '1': IMPLICIT_OR_ENVIRONMENTAL
    '2': CLIMATE_EXPLICIT
    '3': UNCLEAR
